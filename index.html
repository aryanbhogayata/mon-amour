<section id="birthday" class="section birthday"><div class="section-head"><div class="eyebrow">CHAPTER I <span></span> DECEMBER 10</div><h2>Happy birthday,<br><em>my beautiful Kalpana.</em></h2><p>Today is a celebration of the wonderful person you are, and of how lucky I feel that you exist.</p></div>
<div class="birthday-spread"><figure class="polaroid birthday-photo"><img src="assets/photos/birthday.jpg" alt="A special birthday photograph of Kalpana" loading="lazy"><figcaption>The girl who makes my world softer. ♡</figcaption></figure><div class="cake-card"><div class="cake-caption">MAKE A LITTLE WISH</div><div class="cake" aria-hidden="true"><div class="candles"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div><div class="cake-top"></div><div class="cake-tier tier-one"><span>♡ ♡ ♡</span></div><div class="cake-tier tier-two"><span>· &nbsp; · &nbsp; · &nbsp; · &nbsp; ·</span></div><div class="plate"></div></div><button id="wish-button" class="primary">Blow out the candles <span>✧</span></button><p id="wish-message" class="wish-message" aria-live="polite">Close your eyes, think of something beautiful.</p></div></div><a class="next-link" href="#anniversary">And there's another reason to celebrate <span>↓</span></a></section>
<section id="anniversary" class="section anniversary"><div class="section-head"><div class="eyebrow">CHAPTER II <span></span> DECEMBER 11</div><h2>Happy 11-month<br><em>anniversary, Mon Amour.</em></h2><p>Eleven months of choosing you. And a whole future of moments still waiting for us.</p></div>
<div class="counter-wrap"><div class="counter-label">THE TIME WE HAVE HAD TOGETHER <span>♥</span></div><div id="counter" class="counter" aria-label="Time together"><div><strong id="days">—</strong><small>DAYS</small></div><div><strong id="hours">—</strong><small>HOURS</small></div><div><strong id="minutes">—</strong><small>MINUTES</small></div><div><strong id="seconds">—</strong><small>SECONDS</small></div></div><p>Since 11 January 2026 · Indian Standard Time</p></div>
<div class="memory-heading"><div><div class="eyebrow">THE LITTLE THINGS WE KEEP</div><h3>11 months, <em>11 memories.</em></h3></div><p>Tap any photograph to hold that moment a little closer.</p></div><div id="photo-grid" class="photo-grid"></div>
<article class="memory-note"><div class="note-stamp" aria-hidden="true">♡<br><small>US</small></div><div><div class="eyebrow">A DAY I KEEP CLOSE</div><h3>Just you, me, and a kitchen.</h3><p>That day at my place, when we cooked together and cuddled, is one I would happily live all over again. There was nothing extravagant about it. It was simply us, sharing a little piece of ordinary life. And somehow, that made it feel extraordinary.</p><p class="script">With you, ordinary feels like home.</p></div></article><a class="next-link" href="#calls">Even through a screen <span>↓</span></a></section>
<section id="calls" class="section calls-section"><div class="section-head"><div class="eyebrow">CHAPTER III <span></span> LOVE ACROSS A SCREEN</div><h2>No matter<br><em>the distance.</em></h2><p>The little moments that made a screen feel a little less like a screen.</p></div><div id="call-grid" class="call-grid"></div><p class="chapter-quote">“Even on a screen, seeing you makes my day a little brighter.”</p><a class="next-link" href="#home">A day that felt like home <span>↓</span></a></section>
<section id="home" class="section home-section"><div class="section-head"><div class="eyebrow">CHAPTER IV <span></span> A MEMORY I WOULD LIVE AGAIN</div><h2>The day that<br><em>felt like home.</em></h2><p>A whole chapter for one of my favourite ordinary days.</p></div><article class="home-story"><div class="home-illustration" aria-hidden="true"><svg viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="36" y="24" width="328" height="202" rx="6" stroke-dasharray="3 6"/><path d="M65 186h270M95 178h210M140 122h120l-9 53H149zM128 122h144M167 113h66M200 113v-10M179 95c-18-24 12-29-2-50M209 92c-18-24 12-29-2-50M236 96c-18-24 12-29-2-50M88 143h31v33H88zM119 149c23-1 23 21 0 19M280 143h31v33h-31zM311 149c23-1 23 21 0 19"/><path d="M200 208c-14-18-36 3 0 19 36-16 14-37 0-19z" fill="#b36b77" stroke="none"/></g></svg><span>ILLUSTRATION · A LITTLE KITCHEN, A LOT OF LOVE</span></div><div class="home-copy"><div class="eyebrow">JUST US</div><h3>My favourite kind of day.</h3><p>We cooked together at my place, we cuddled, and for a little while the world could wait. I keep thinking about how simple it was, and how much it meant to me.</p><p>I didn't need a grand plan to feel happy. Being beside you, sharing a meal and holding you close was more than enough.</p><p>If I could ask for another day like that, I would. A hundred times over.</p><p class="script">Home is a feeling I find with you. ♡</p></div></article><a class="next-link" href="#stars">Look up at our little universe <span>↓</span></a></section>
<section id="stars" class="section stars-section"><div class="section-head"><div class="eyebrow">CHAPTER V <span></span> A SKY FULL OF LITTLE THINGS</div><h2>Our little<br><em>universe.</em></h2><p>Touch the stars to discover the memories and promises tucked inside.</p></div><div class="sky" id="sky"><svg class="star-lines" viewBox="0 0 100 60" preserveAspectRatio="none" aria-hidden="true"><path d="M12 35 L26 13 L45 25 L62 9 L84 24 L70 47 L45 52 L28 39 L12 35 M45 25L45 52 M45 25L70 47"/></svg><div id="star-buttons"></div></div><article class="star-note" aria-live="polite"><span id="star-count" class="eyebrow">0 / 8 STARS DISCOVERED</span><h3 id="star-title">Pick a star, Mon Amour.</h3><p id="star-message">Every light has a little piece of our story.</p></article><a class="next-link" href="#reasons">Eleven reasons I would choose you <span>↓</span></a></section>
<section id="reasons" class="section reasons"><div class="section-head"><div class="eyebrow">CHAPTER VI <span></span> ELEVEN LITTLE NOTES</div><h2>11 reasons why<br><em>I'd choose you.</em></h2><p>One little love note for every month of us. Open them one by one.</p></div><div class="reason-progress"><span id="reason-count" aria-live="polite">0 of 11 opened</span><div class="progress-track"><div id="progress-fill"></div></div></div><div id="reason-grid" class="reason-grid"></div><p id="all-reasons" class="script all-reasons" hidden>And even eleven could never be enough. ♡</p><a class="next-link" href="#open-when">Letters for the days ahead <span>↓</span></a></section>
<section id="open-when" class="section open-when-section"><div class="section-head"><div class="eyebrow">CHAPTER VII <span></span> FOR THE DAYS IN BETWEEN</div><h2>Open when<br><em>you need me.</em></h2><p>Five little envelopes to return to whenever you need a little love.</p></div><div id="open-when-grid" class="open-when-grid"></div><dialog id="note-dialog" class="note-dialog" aria-labelledby="note-title"><button id="close-note" class="dialog-close" aria-label="Close letter">×</button><div class="eyebrow">FOR MY MON AMOUR</div><h3 id="note-title"></h3><p id="note-body"></p><p class="script">Always yours, ♡</p></dialog><a class="next-link" href="#letter">A letter from my heart <span>↓</span></a></section>
<section id="letter" class="section letter-section"><div class="section-head"><div class="eyebrow">CHAPTER VIII <span></span> FROM MY HEART</div><h2>Words I hope<br><em>you'll always keep.</em></h2><p>A letter for the girl who means so much to me.</p></div><article class="letter-paper"><div class="letter-meta"><span>To: my Mon Amour</span><span>December 2026</span></div><div class="letter-fold"><div class="letter-heart">♥</div><h3>A little letter, sealed with love.</h3><button id="read-letter" class="primary" aria-expanded="false" aria-controls="letter-content">Unfold my letter <span>♡</span></button></div><div id="letter-content" hidden><h3>My dearest Kalpana,</h3><div id="letter-paragraphs"></div><p class="signature">Always yours,<br><em>with all my love. ♡</em></p></div></article><a class="next-link" href="#film">Watch our little film <span>↓</span></a></section>
<section id="film" class="section film-section"><div class="section-head"><div class="eyebrow">CHAPTER IX <span></span> A LITTLE FILM OF US</div><h2>If our memories<br><em>were a movie.</em></h2><p>Our photographs, a few words, and Blue playing in the background.</p></div><div class="film-cover"><img src="assets/photos/forever.jpg" alt="A photograph of us together" loading="lazy"><div class="film-cover-copy"><span class="eyebrow">K &amp; A · A SHORT FILM</span><h3>My favourite story is ours.</h3><button class="primary light" id="open-film">▶ &nbsp; Watch our film</button><small>About 1 minute · with our song</small></div></div><dialog id="film-dialog" class="film-dialog" aria-label="Our cinematic photo montage"><button id="close-film" class="dialog-close" aria-label="Close film">×</button><div id="film-stage" class="film-stage"><img id="film-image" alt=""></div><div class="film-overlay"><span id="film-number"></span><p id="film-caption"></p></div><div class="film-controls"><progress id="film-progress" max="65" value="0" aria-label="Film progress"></progress><div class="film-buttons"><button id="film-prev" class="film-control" aria-label="Previous photograph">←</button><button id="film-play" class="film-control">Pause</button><button id="film-next" class="film-control" aria-label="Next photograph">→</button><button id="film-replay" class="film-control">Replay ↺</button></div><p id="film-status" role="status">The film uses the same music player as the rest of the site.</p></div></dialog><a class="next-link" href="#keepsakes">Something you can keep <span>↓</span></a></section>
<section id="keepsakes" class="section keepsakes-section"><div class="section-head"><div class="eyebrow">CHAPTER X <span></span> TWO LITTLE KEEPSAKES</div><h2>A little piece<br><em>of us, to keep.</em></h2><p>Save these two photo collages to your phone and take a little piece of this day with you.</p></div><div class="keepsake-grid"><article><img src="assets/keepsakes/birthday.jpg" alt="Birthday photo collage" loading="lazy"><h3>For your birthday</h3><a class="primary" href="assets/keepsakes/birthday.jpg" download="Happy-Birthday-Mon-Amour.jpg">Download birthday collage ↓</a></article><article><img src="assets/keepsakes/anniversary.jpg" alt="Eleven-month anniversary photo collage" loading="lazy"><h3>For eleven months of us</h3><a class="primary" href="assets/keepsakes/anniversary.jpg" download="Happy-11-Month-Anniversary.jpg">Download anniversary collage ↓</a></article></div><a class="next-link" href="#embrace">Come a little closer <span>↓</span></a></section>
<section id="embrace" class="section embrace-section"><div class="section-head"><div class="eyebrow">CHAPTER XI <span></span> AS MANY AS YOU NEED</div><h2>Come here,<br><em>Mon Amour.</em></h2><p>A little hug or kiss whenever you want one. There is no limit.</p></div><div class="hug-card"><div id="hug-heart" class="hug-heart" aria-hidden="true">♡</div><p class="script" id="hug-message" aria-live="polite">A little love from me to you.</p><div class="hug-actions"><button id="send-hug" class="primary">Send me a hug ♡</button><button id="send-kiss" class="primary">Send me a kiss ♡</button></div><p class="hug-count" id="hug-count">0 hugs · 0 kisses · infinite love</p></div><a class="next-link" href="#finale">And a lifetime still to go <span>↓</span></a></section>
<section id="finale" class="section finale"><div class="finale-inner"><div class="eyebrow">CHAPTER XII <span></span> TO BE CONTINUED</div><figure class="final-photo"><img src="assets/photos/forever.jpg" alt="A favourite photograph of us together" loading="lazy"><figcaption>My favourite story is ours.</figcaption></figure><h2>11 months down.<br><em>A lifetime to go.</em></h2><p>Happy birthday, Kalpana. Happy 11 months, Mon Amour.<br>In all the little moments still to come, I hope it's you and me.</p><button id="final-heart" class="primary light">One more kiss for you <span>♡</span></button><p id="final-message" class="script" aria-live="polite"></p><button id="restart" class="text-button">Read it all again ↺</button></div><img class="botanical final-botanical" src="assets/botanical.svg" alt=""></section>
